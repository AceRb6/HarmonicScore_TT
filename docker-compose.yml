services:
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: harmonic_django
    command: sh -c "python manage.py makemigrations && python manage.py migrate && python manage.py runserver 0.0.0.0:8001"
    volumes:
      - ./backend:/app
      # CRÍTICO: Comparte la carpeta de salidas para que Django pueda servir los PDFs generados en Windows
      - ./ml-service/storage/outputs:/app/ml-service/storage/outputs
    ports:
      - "8001:8001"
    env_file:
      - path: ./.env
        required: false
      - path: ./.env.correo
        required: false
    environment:
      - DEBUG=1
      - DB_HOST=db
      - DB_NAME=harmonic
      - DB_USER=admin
      - DB_PASSWORD=admin
      # CORREGIDO: El fallback ahora es host.docker.internal (más seguro que 127.0.0.1)
      - ML_SERVICE_URL=${ML_SERVICE_URL:-http://host.docker.internal:8000}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: harmonic_celery_worker
    command: celery -A app worker -l info
    volumes:
      - ./backend:/app
      # CRÍTICO: Permite al worker escribir/leer en la misma carpeta compartida
      - ./ml-service/storage/outputs:/app/ml-service/storage/outputs
    env_file:
      - path: ./.env
        required: false
      - path: ./.env.correo
        required: false
    environment:
      - DEBUG=1
      - DB_HOST=db
      - DB_NAME=harmonic
      - DB_USER=admin
      - DB_PASSWORD=admin
      # CORREGIDO: Fallback a host.docker.internal
      - ML_SERVICE_URL=${ML_SERVICE_URL:-http://host.docker.internal:8000}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7
    container_name: harmonic_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:15
    container_name: harmonic_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: harmonic
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d harmonic"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
